name: CI - Lint & Test

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

jobs:
  test-agents-and-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies & run syntax check
        run: |
          python -m pip install --upgrade pip
          pip install pytest flake8
          flake8 apps/backend-api/main.py apps/agents/scout/main.py apps/agents/enricher/main.py apps/agents/outreach/main.py --count --select=E9,F63,F7,F82 --show-source --statistics

  test-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install & Lint Frontend
        run: |
          cd apps/frontend
          npm ci
          npm run lint || true
